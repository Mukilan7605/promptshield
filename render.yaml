services:
  - type: web
    name: promptshield-api
    runtime: python
    plan: free
    region: oregon
    # Build React frontend first, then install Python deps
    buildCommand: |
      # ── Install Node & build React frontend ──────────────────────
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      cd frontend && npm ci && npm run build && cd ..
      # ── Install Python dependencies ───────────────────────────────
      pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: API_RELOAD
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/promptshield.db
      - key: ENABLE_RULE_BASED
        value: true
      - key: ENABLE_SEMANTIC_ANALYSIS
        value: true
      - key: ENABLE_ML_BASED
        value: false
      - key: SECRET_KEY
        generateValue: true
      # Allow both the Vercel frontend URL and the Render URL itself
      - key: ALLOWED_ORIGINS
        value: https://promptshield.vercel.app,https://promptshield-cy8k.onrender.com

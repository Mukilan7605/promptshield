services:
  - type: web
    name: promptshield-api
    runtime: docker          # Use Dockerfile for Node + Python multi-stage build
    plan: free
    region: oregon
    # Render will auto-detect and use the Dockerfile in the repo root.
    # No buildCommand / startCommand needed — CMD in Dockerfile handles startup.
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: API_RELOAD
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/promptshield.db
      - key: ENABLE_RULE_BASED
        value: true
      - key: ENABLE_SEMANTIC_ANALYSIS
        value: true
      - key: ENABLE_ML_BASED
        value: false
      - key: SECRET_KEY
        generateValue: true
      # Allow both the Vercel URL and the Render URL itself
      - key: ALLOWED_ORIGINS
        value: https://promptshield.vercel.app,https://promptshield-cy8k.onrender.com


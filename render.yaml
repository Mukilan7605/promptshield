services:
  # ── 1. Backend — FastAPI (Python web service) ─────────────────
  - type: web
    name: promptshield-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: API_RELOAD
        value: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/promptshield.db
      - key: ENABLE_RULE_BASED
        value: true
      - key: ENABLE_SEMANTIC_ANALYSIS
        value: true
      - key: ENABLE_ML_BASED
        value: false
      - key: SECRET_KEY
        generateValue: true
      # Explicitly list all known frontend origins.
      # main.py merges this with _KNOWN_ORIGINS list at startup.
      - key: ALLOWED_ORIGINS
        value: "https://frontend-ten-theta-72.vercel.app,https://frontend-inwpphl4z-mukilan7605-6364.vercel.app,http://localhost:3000"

  # ── 2. Frontend — React/Vite (Render Static Site) ────────────
  - type: static-site
    name: promptshield-frontend
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # React Router: every path must fall through to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://promptshield-cy8k.onrender.com
